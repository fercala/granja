<style>@font-face{font-family:"Fredoka";font-style:normal;font-weight:300 700;font-display:swap;src:url(fonts/fredoka-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+2020, U+2113}@font-face{font-family:"Fredoka";font-style:normal;font-weight:300 700;font-display:swap;src:url(fonts/fredoka-latin.woff2) format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}</style>
<style>
:root{--ink:#4A3428;--paper:#FFF7E6;--barn:#C8473A;--grass:#6DBE45;--gold:#FFC93C;--sky:#8FD3F4;color-scheme:light}
html,body{margin:0;height:100%;background:#2E2420;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:"Fredoka","Baloo 2",system-ui,sans-serif;color:var(--ink)}
[hidden]{display:none!important}
#cv{position:fixed;inset:0;display:block;touch-action:none}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;z-index:5}
.ov.dim{background:rgba(46,36,32,.55)}
.card{background:var(--paper);border:5px solid var(--ink);border-radius:32px;padding:22px 26px;max-width:600px;width:100%;box-shadow:0 10px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto;box-sizing:border-box;touch-action:pan-y}
.card h1{margin:0;font-size:clamp(34px,6vw,58px);line-height:1.05;font-weight:700;text-align:center}
.card h2{margin:0;font-size:28px;font-weight:700}
.card h3{margin:6px 0 0;font-size:19px;font-weight:600}
.card p{margin:0;font-size:17px;line-height:1.35}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
button{font:inherit;font-weight:600;font-size:20px;color:var(--ink);background:#fff;border:4px solid var(--ink);border-radius:999px;padding:8px 20px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
button.big{font-size:34px;padding:12px 44px;background:var(--grass);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
button.warn{background:#FFE1DC}
#start .card{align-items:center;text-align:center;background:rgba(255,247,230,.96)}
#start h1 span{display:inline-block;background:#E0A458;border:4px solid var(--ink);border-radius:14px;padding:0 12px;transform:rotate(-3deg);box-shadow:0 5px 0 var(--ink);margin-top:6px}
#rot{background:#8FD3F4;z-index:20;flex-direction:column;gap:16px;text-align:center;font-size:26px;font-weight:600}
#rot .phone{width:90px;height:150px;border:8px solid var(--ink);border-radius:20px;background:#fff;animation:turn 2s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#adult .card{max-width:640px;align-items:stretch}
.set{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;font-size:18px}
.set label{min-width:0}
select,input[type=text]{font:inherit;font-size:19px;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;background:#fff;color:var(--ink)}
input[type=range]{width:170px;accent-color:var(--barn)}
input[type=checkbox]{width:26px;height:26px;accent-color:var(--barn)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stats div{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 10px;font-size:16px}
.stats b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
#nameOv .card{max-width:480px;align-items:stretch}
#nameIn{font-size:34px;text-align:center;font-weight:600}
@media (prefers-reduced-motion:reduce){#rot .phone{animation:none}}
</style>
<canvas id="cv"></canvas>
<div id="start" class="ov dim">
  <div class="card">
    <h1>La Granja<br>de <span id="stName">...</span></h1>

    <button id="bPlay" class="big">▶ Jugar</button>

    <p id="iosHelp" hidden></p>
  </div>
</div>
<div id="rot" class="ov" hidden><div class="phone"></div>Gira el celular</div>
<div id="nameOv" class="ov dim" hidden>
  <div class="card">
    <h2 id="nameTitle">Escribe el nombre</h2>

    <div class="row"><button id="nameOk" class="big">Listo</button><button id="nameCancel">Cancelar</button></div>
  </div>
</div>
<div id="adult" class="ov dim" hidden>
  <div class="card">
    <h2>Zona de adultos</h2>
    <div class="row" id="restRow" hidden><button id="aResume" class="big">Seguir jugando 10 minutos</button></div>
    <h3>Tiempo</h3>
    <div class="set">
      <label for="aDay">Duración de un día del juego</label>
      <select id="aDay"><option value="240">4 minutos</option><option value="480">8 minutos</option><option value="900">15 minutos</option><option value="0">Solo cuando se va a dormir</option></select>
      <label for="aDps">Días que dura cada estación</label>
      <select id="aDps"><option value="3">3 días</option><option value="5">5 días</option><option value="7">7 días</option></select>
      <label for="aSeason">Estaciones</label>
      <select id="aSeason"><option value="auto">Avanzan solas con el juego</option><option value="real">Según el calendario real</option></select>
      <label for="aHemi">Hemisferio (calendario real)</label>
      <select id="aHemi"><option value="S">Sur</option><option value="N">Norte</option></select>
      <label for="aLimit">Límite de juego</label>
      <select id="aLimit"><option value="0">Sin límite</option><option value="10">10 minutos</option><option value="15">15 minutos</option><option value="20">20 minutos</option></select>
    </div>
    <h3>Sonido</h3>
    <div class="set">
      <label for="aVoice">Voz</label><input id="aVoice" type="checkbox">
      <label for="aMus">Música</label><input id="aMus" type="range" min="0" max="1" step="0.05">
      <label for="aFx">Efectos y animales</label><input id="aFx" type="range" min="0" max="1" step="0.05">
    </div>
    <h3>Resumen</h3>
    <div class="stats" id="aStats"></div>
    <h3>Granjero</h3>
    <div class="row"><button id="aLook">Cambiar aspecto y nombre</button><button id="aFs">Pantalla completa</button></div>
    <div class="row"><button id="aReset" class="warn">Empezar una granja nueva</button></div>
    <div class="row" id="aResetConfirm" hidden><p>Se borran todos los animales y cultivos.</p><button id="aResetYes" class="warn">Sí, borrar</button><button id="aResetNo">No</button></div>
    <div class="row"><button id="aClose" class="big">Cerrar</button></div>
  </div>
</div>
<script>
'use strict';
/* ===== Base: lienzo, toques, sonido, voz, guardado ===== */
const WEB_BUILD = true;
const W = 1600, H = 900;
const cv = document.getElementById('cv');
let c = cv.getContext('2d');
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (a, b, x, y) => Math.hypot(a - x, b - y);
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
let now = 0;

let SC = 1, OX = 0, OY = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const w = innerWidth, h = innerHeight;
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  SC = Math.min(w / W, h / H); OX = (w - W * SC) / 2; OY = (h - H * SC) / 2;
  const touch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  $('rot').hidden = !(touch && h > w * 1.05);
}
addEventListener('resize', resize);

/* --- colores --- */
function hex2(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function mix(a, b, t) { const A = hex2(a), B = hex2(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * clamp(t, 0, 1))).join(',') + ')'; }

/* --- dibujo básico --- */
const INK = '#4A3428';
const P2 = new Map();
function p2(d) { let p = P2.get(d); if (!p) { p = new Path2D(d); P2.set(d, p); } return p; }
function stroke(w = 3.5, col = INK) { c.lineWidth = w; c.strokeStyle = col; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); }
function fillS(fill, w = 3.5) { if (fill) { c.fillStyle = fill; c.fill(); } if (w) stroke(w); }
function pd(d, fill, w = 3) { const p = p2(d); if (fill) { c.fillStyle = fill; c.fill(p); } if (w) { c.lineWidth = w; c.strokeStyle = INK; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(p); } }
function pdS(d, col, w) { c.lineWidth = w; c.strokeStyle = col; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke(p2(d)); }
function poly(pts, fill, w = 3.5) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); fillS(fill, w); }
function circ(x, y, r, fill, w = 3) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); fillS(fill, w); }
function ell(x, y, rx, ry, fill, w = 3, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, Math.PI * 2); fillS(fill, w); }
function rr(x, y, w, h, r, fill, lw = 3) { c.beginPath(); c.roundRect(x, y, w, h, r); fillS(fill, lw); }
function line(x1, y1, x2, y2, col = INK, w = 3) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.stroke(); }
function txt(s, x, y, size = 40, col = INK, align = 'center', weight = 600, outline = 0) {
  c.font = weight + ' ' + size + 'px Fredoka, "Baloo 2", system-ui, sans-serif';
  c.textAlign = align; c.textBaseline = 'middle';
  if (outline) { c.lineWidth = outline; c.strokeStyle = typeof outline === 'number' ? '#fff' : outline; c.lineJoin = 'round'; c.strokeText(s, x, y); }
  c.fillStyle = col; c.fillText(s, x, y);
}
function star(x, y, r, fill = '#FFC93C', w = 3) {
  c.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * .48 : r; c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
  c.closePath(); fillS(fill, w);
}
function heart(x, y, s, fill = '#E85D75') { c.save(); c.translate(x, y); c.scale(s, s); pd('M0 12 q-20 -12 -14 -24 q8 -8 14 2 q6 -10 14 -2 q6 12 -14 24Z', fill, 2.5); c.restore(); }

/* --- toques y mouse --- */
const ptr = { x: 0, y: 0, sx: 0, sy: 0, down: false, id: null, moved: 0, t0: 0 };
let idleT = 0;
function toL(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left - OX) / SC, (e.clientY - r.top - OY) / SC]; }
cv.addEventListener('pointerdown', e => {
  if (ptr.down && ptr.id !== e.pointerId) return;
  e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  audioInit();
  const [x, y] = toL(e);
  Object.assign(ptr, { x, y, sx: x, sy: y, down: true, id: e.pointerId, moved: 0, t0: now });
  idleT = 0;
  if (scene && scene.down) scene.down(x, y);
});
cv.addEventListener('pointermove', e => {
  if (!ptr.down || e.pointerId !== ptr.id) return;
  e.preventDefault();
  const [x, y] = toL(e); const dx = x - ptr.x, dy = y - ptr.y;
  ptr.moved += Math.hypot(dx, dy); ptr.x = x; ptr.y = y; idleT = 0;
  if (scene && scene.move) scene.move(x, y, dx, dy);
});
function pUp(e) {
  if (!ptr.down || e.pointerId !== ptr.id) return;
  ptr.down = false;
  const [x, y] = toL(e);
  if (scene && scene.up) scene.up(x, y, ptr.moved < 18 && now - ptr.t0 < 1.2);
}
cv.addEventListener('pointerup', pUp);
cv.addEventListener('pointercancel', pUp);
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

/* --- sonido (sintetizado, sin archivos) --- */
let AC = null, master, fxBus, musBus, NOISE = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.connect(AC.destination);
    fxBus = AC.createGain(); musBus = AC.createGain(); fxBus.connect(master); musBus.connect(master);
    const len = AC.sampleRate; NOISE = AC.createBuffer(1, len, AC.sampleRate);
    const d = NOISE.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    applyVol();
  } catch (e) { AC = null; }
}
function applyVol() { if (!AC || !S) return; fxBus.gain.value = S.cfg.fx; musBus.gain.value = S.cfg.mus * .55; }
function env(g, t, a, d, v) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(v, .0002), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + d); }
function tone(f, d, type = 'sine', v = .2, f2 = 0, when = 0, bus) {
  if (!AC) return; bus = bus || fxBus;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  env(g, t, .015, d, v); o.connect(g); g.connect(bus); o.start(t); o.stop(t + d + .05);
}
function noise(d, v = .2, fc = 1200, q = 1, when = 0, type = 'bandpass', fc2 = 0) {
  if (!AC) return;
  const t = AC.currentTime + when, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NOISE; s.loop = true; f.type = type; f.frequency.setValueAtTime(fc, t); if (fc2) f.frequency.exponentialRampToValueAtTime(fc2, t + d); f.Q.value = q;
  env(g, t, .01, d, v); s.connect(f); f.connect(g); g.connect(fxBus); s.start(t); s.stop(t + d + .05);
}
/* voz animal: oscilador con vibrato y filtro */
function voc(f0, f1, d, type, v, lp, vib = 0, vibF = 6, when = 0) {
  if (!AC) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.linearRampToValueAtTime(f1, t + d);
  if (vib) { const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = vibF; lg.gain.value = vib; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + d + .05); }
  f.type = 'lowpass'; f.frequency.value = lp; f.Q.value = 2;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + d * .2); g.gain.setValueAtTime(v, t + d * .7); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(f); f.connect(g); g.connect(fxBus); o.start(t); o.stop(t + d + .05);
}
const SFX = {
  pop() { tone(520, .12, 'sine', .25, 980); },
  tap() { tone(700, .07, 'triangle', .15, 900); },
  ding() { tone(988, .25, 'sine', .2); tone(1319, .35, 'sine', .15, 0, .08); },
  sparkle() { [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, .25, 'sine', .12, 0, i * .07)); },
  yay() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .3, 'triangle', .16, 0, i * .1)); },
  no() { tone(330, .18, 'triangle', .15, 260); },
  water() { noise(.9, .12, 2400, 1.5, 0, 'bandpass', 900); for (let i = 0; i < 5; i++) tone(rnd(900, 1500), .06, 'sine', .06, 0, rnd(0, .7)); },
  seeds() { for (let i = 0; i < 6; i++) noise(.05, .1, 3500, 3, i * .08); },
  dig() { noise(.15, .2, 300, 1, 0, 'lowpass'); },
  pour() { noise(.6, .12, 900, 1, 0, 'lowpass', 500); },
  munch() { for (let i = 0; i < 3; i++) noise(.06, .14, 1800, 2, i * .14); },
  squirt() { noise(.18, .15, 3000, 4, 0, 'bandpass', 1500); },
  snip() { noise(.05, .18, 5000, 5); tone(2600, .05, 'square', .04); },
  splash() { noise(.5, .2, 1200, .8, 0, 'lowpass', 400); },
  step() { noise(.04, .04, 500, 1, 0, 'lowpass'); },
  whoosh() { noise(.5, .1, 400, 1, 0, 'bandpass', 2400); },
  thunder() { noise(1.8, .25, 120, .7, 0, 'lowpass', 60); },
  moo(b) { b ? voc(260, 220, .55, 'sawtooth', .16, 900, 6) : voc(150, 115, 1.0, 'sawtooth', .2, 600, 5, 5); },
  baa(b) { b ? voc(560, 520, .45, 'square', .08, 1800, 40, 18) : voc(330, 300, .7, 'square', .09, 1300, 30, 14); },
  oink(b) { const f = b ? 380 : 200; voc(f, f * .8, .14, 'sawtooth', .16, 900); voc(f * 1.1, f * .7, .16, 'sawtooth', .14, 900, 0, 6, .2); noise(.12, .08, 600, 2, 0); },
  cluck() { for (let i = 0; i < 3; i++) voc(700 + i * 60, 900, .07, 'triangle', .12, 2500, 0, 6, i * .11); voc(600, 1000, .2, 'triangle', .12, 2500, 0, 6, .38); },
  peep() { for (let i = 0; i < 3; i++) voc(2400, 2900, .08, 'sine', .08, 6000, 0, 6, i * .15); },
  rooster() { [[500, 700, .15], [700, 760, .15], [760, 900, .35], [900, 620, .45]].forEach(([a, b, d], i, arr) => { let w = 0; for (let j = 0; j < i; j++) w += arr[j][2]; voc(a, b, d, 'sawtooth', .1, 2200, 12, 12, w); }); },
  bark() { voc(420, 260, .12, 'sawtooth', .14, 1400); noise(.1, .1, 900, 2); voc(440, 270, .12, 'sawtooth', .13, 1400, 0, 6, .2); },
  croak() { voc(140, 120, .25, 'square', .1, 500, 20, 30); },
  bird() { for (let i = 0; i < 4; i++) tone(rnd(2500, 3400), .07, 'sine', .06, rnd(2000, 4000), i * .1); },
};

/* --- música suave por estación --- */
const MUS = {
  pri: [262, 294, 330, 392, 440, 523, 587, 659], ver: [196, 220, 247, 294, 330, 392, 440, 494],
  oto: [220, 262, 294, 330, 392, 440, 523, 587], inv: [147, 175, 196, 220, 262, 294, 349, 392],
};
let musNext = 0, musIdx = 3, musOn = false;
function musicTick() {
  if (!AC || !S || S.cfg.mus <= 0.001 || !musOn) return;
  const t = AC.currentTime;
  if (musNext < t) musNext = t + .1;
  const night = typeof phaseNow === 'function' && phaseNow() === 'noche';
  const sc = MUS[typeof seasonNow === 'function' ? seasonNow() : 'pri'];
  const beat = night ? .62 : .36;
  while (musNext < t + .3) {
    const step = Math.round(musNext / beat);
    if (Math.random() < (night ? .55 : .7)) {
      musIdx = clamp(musIdx + pick([-2, -1, -1, 1, 1, 2, 0]), 0, sc.length - 1);
      tone(sc[musIdx], night ? .9 : .32, night ? 'sine' : 'triangle', night ? .05 : .045, 0, musNext - t, musBus);
    }
    if (step % 4 === 0) tone(sc[0] / 2, beat * 3.2, 'sine', .05, 0, musNext - t, musBus);
    musNext += beat;
  }
}

/* --- voz en español --- */
let VOICE = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();

  /* --- toques --- */

  move(x, y, dx, dy) {

  hitAt(sx, sy) {

const COCINA = {
  enter() { musOn = true; this.stage = 'pick'; this.rec = null; this.units = []; this.drag = null; this.prog = 0; this.cookT = 0; this.doneT = 0; setTimeout(() => say('¡Bienvenido a la cocina! ¿Qué cocinamos hoy?'), 300); },
  start(r) {

    for (const [k, n] of Object.entries(r.need)) for (let j = 0; j < n; j++) { const sl = SLOTS[i++]; this.units.push({ k, x: sl[0], y: sl[1], hx: sl[0], hy: sl[1], inb: false, fly: null }); }

  },
  update(dt) {

      if (u.fly) { u.fly.t += dt * 2.2; const q = ease(Math.min(1, u.fly.t)); u.x = lerp(u.fly.x, BOWL[0], q); u.y = lerp(u.fly.y, BOWL[1] - 30, q) - Math.sin(q * Math.PI) * 160; if (u.fly.t >= 1) { u.fly = null; this.plop(u); } }

    }
    if (this.stage === 'cook' && this.cookT > 0) { this.cookT += dt; if (Math.random() < dt * 3) SFX.tap(); if (this.cookT > 3.2) this.finish(); }
    if (this.stage === 'done') this.doneT += dt;
    partsUpdate(dt);
  },
  plop(u) {
    u.inb = true; SFX.splash(); burst('drop', BOWL[0], BOWL[1] - 40, 5, { g: 500 });
    if (this.units.every(v => v.inb)) { this.stage = 'stir'; setTimeout(() => say('¡Ahora a revolver! Mueve la cuchara en el bol.'), 500); }
  },
  finish() {
    const r = this.rec; for (const [k, n] of Object.entries(r.need)) S.inv[k] -= n;
    S.inv[r.k] = (S.inv[r.k] || 0) + 1; S.today[r.k] = (S.today[r.k] || 0) + 1; S.cooked[r.k] = (S.cooked[r.k] || 0) + 1;
    logEv('cook', { dish: r.k }); FARM.addStars(2); this.stage = 'done'; this.doneT = 0; SFX.ding(); setTimeout(() => SFX.yay(), 300);
    burst('spark', 800, 400, 16); say(`¡Hicimos ${ITEMS[r.k][2] ? 'una' : 'un'} ${ITEMS[r.k][0]}! ¡Qué rico! Ya está en la cesta.`); save();
  },
  draw() {
    kitchenBg(); backBtn();
    if (this.stage === 'pick') return this.pickDraw();
    const r = this.rec;
    if (r.tool) drawAppliance(r.tool, ...APPL, this.cookT, this.stage === 'cook' && this.cookT > 0);
    if (this.stage === 'cook' && this.cookT === 0) { const k = (now * 1.3) % 1; c.globalAlpha = 1 - k; circ(APPL[0], APPL[1] - 40, 170 + k * 40, null, 7); c.strokeStyle = '#FFE066'; c.lineWidth = 7; c.stroke(); c.globalAlpha = 1; }
    if (this.stage !== 'done') {
      const n = this.units.filter(u => u.inb).length, tot = this.units.length;
      ell(BOWL[0], BOWL[1] - 60, 190, 50, '#9FB4C2', 5);
      if (n) { c.save(); c.beginPath(); c.ellipse(BOWL[0], BOWL[1] - 60, 176, 40, 0, 0, 7); c.clip(); ell(BOWL[0], BOWL[1] - 60 + 30 - 30 * n / tot, 176, 40, this.stage === 'add' ? '#F2E6CF' : mix(r.col, '#ffffff', .2 * (1 - this.prog)), 0); if (this.stage === 'stir') { c.save(); c.translate(BOWL[0], BOWL[1] - 50); c.scale(1, .25); for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(0, 0, 40 + i * 40, now * 3 + i, now * 3 + i + 3); stroke(8, 'rgba(255,255,255,.6)'); } c.restore(); } c.restore(); }
      pd(`M${BOWL[0] - 190} ${BOWL[1] - 60} q0 150 190 150 q190 0 190 -150 q-190 50 -380 0Z`, '#5BB8F0', 5);
      ell(BOWL[0], BOWL[1] + 86, 90, 14, '#4A9FD8', 4);
      if (this.stage === 'stir') {
        const a = now * 4, sx = BOWL[0] + Math.cos(this.spoon || 0) * 90, sy = BOWL[1] - 64 + Math.sin(this.spoon || 0) * 20;
        line(sx, sy, sx + 70, sy - 190, INK, 18); line(sx, sy, sx + 70, sy - 190, '#C99A5A', 11); ell(sx, sy, 22, 12, '#C99A5A', 4); void a;
        const gx = BOWL[0] - 330, gy = BOWL[1] - 200; circ(gx, gy, 54, '#fff', 4); c.beginPath(); c.arc(gx, gy, 38, -Math.PI / 2, -Math.PI / 2 + this.prog * Math.PI * 2); stroke(16, '#6DBE45'); circ(gx, gy, 22, '#FFF4C2', 3);
      }
      for (const u of this.units) if (!u.inb) { ell(u.hx, u.hy + 40, 50, 12, 'rgba(0,0,0,.12)', 0); drawItem(u.k, u.x, u.y, 2.2); }
      if (this.stage === 'add' && !this.drag && !this.units.some(u => u.fly)) { const u = this.units.find(v => !v.inb); if (u) { const k = (now * 1.2) % 1; c.globalAlpha = 1 - k; circ(u.x, u.y, 60 + k * 26, null, 5); c.globalAlpha = 1; } }

    } else {

      c.save(); c.translate(800, 420); for (let i = 0; i < 12; i++) { const a = i * .524 + now * .5; line(Math.cos(a) * 160 * k, Math.sin(a) * 160 * k, Math.cos(a) * 230 * k, Math.sin(a) * 230 * k, '#FFD447', 10); } c.restore();
      drawItem(r.k, 800, 420, 5 * k);

  pickDraw() {
    txt('¿Qué cocinamos?', 800, 80, 56, INK, 'center', 700);
    RECIPES.forEach((r, j) => {
      const x = 110 + (j % 4) * 350, y = 150 + Math.floor(j / 4) * 280, ok = recipeOk(r);
      bigBtn({ x, y, w: 330, h: 250 }, ok ? '#fff' : '#F1E8D6');
      c.globalAlpha = ok ? 1 : .5; drawItem(r.k, x + 165, y + 80, 2.1); c.globalAlpha = 1;
      txt(cap(dishName(r.k)), x + 165, y + 158, 28, ok ? INK : '#9A8A7A', 'center', 700);
      const ing = Object.entries(r.need), w0 = ing.length * 96;
      ing.forEach(([k, n], i) => { const ix = x + 165 - w0 / 2 + 48 + i * 96, have = (S.inv[k] || 0) >= n; c.globalAlpha = have ? 1 : .4; drawItem(k, ix - 16, y + 210, .8); c.globalAlpha = 1; txt('×' + n, ix + 22, y + 214, 24, have ? INK : '#B5A595', 'center', 700); });

    });

  },
  down(x, y) {
    if (this.stage !== 'add') return;
    for (const u of this.units) if (!u.inb && !u.fly && dist(x, y, u.x, u.y) < 70) { this.drag = { u, ox: u.x - x, oy: u.y - y }; SFX.pop(); return; }
  },
  move(x, y, dx, dy) {
    if (this.drag) { this.drag.u.x = x + this.drag.ox; this.drag.u.y = y + this.drag.oy; return; }

      this.prog = Math.min(1, this.prog + Math.hypot(dx, dy) / 2600); this.spoon = (this.spoon || 0) + Math.hypot(dx, dy) / 60;

    }
  },
  up(x, y, tap) {
    if (tap && dist(x, y, 90, 90) < 56) { SFX.whoosh(); go(FARM, { back: true }); return; }
    if (this.drag) {
      const u = this.drag.u; this.drag = null;
      if (tap || dist(u.x, u.y, BOWL[0], BOWL[1] - 40) < 200) { u.fly = { t: 0, x: u.x, y: u.y }; SFX.whoosh(); }

      });

    if (this.stage === 'stir' && dist(x, y, BOWL[0], BOWL[1] - 40) < 260) { this.move(x, y, 90, 0); return; }
    if (this.stage === 'cook' && this.cookT === 0 && dist(x, y, APPL[0], APPL[1] - 40) < 220) { this.cookT = .001; if (this.rec.tool === 'licuadora') SFX.blend(); else if (this.rec.tool === 'sarten') SFX.sizzle(); else SFX.pour(); return; }
    if (this.stage === 'done' && dist(x, y, 800, 690) < 70) { SFX.pop(); this.stage = 'pick'; this.rec = null; say('¿Cocinamos otra cosa?'); }
  },
};
function r_next(r) { return r.tool ? 'cook' : 'done'; }

/* --- el álbum de la granja --- */
const ALBUM_ORDER = ['gallo', 'gallina', 'vaca', 'oveja', 'cerdo', 'caballo', 'conejo', 'pato'];
const ALBUM = {
  enter() { this.page = 0; this.entries = this.build(); setTimeout(() => say('¡El álbum de la granja! Toca una foto.'), 300); },
  build() {
    const an = S.animals.slice().sort((a, b) => ALBUM_ORDER.indexOf(a.sp) - ALBUM_ORDER.indexOf(b.sp) || a.born - b.born || a.id - b.id);
    return an.map(a => ({ kind: 'animal', a })).concat(DISHES.map(k => ({ kind: 'dish', k })), [{ kind: 'npc', who: 'ramon' }, { kind: 'npc', who: 'paco' }]);
  },
  pages() { return Math.ceil(this.entries.length / 12); },
  cardPos(i) { const side = Math.floor(i / 6), j = i % 6; return [150 + side * 680 + (j % 3) * 215, 150 + Math.floor(j / 3) * 330]; },
  update(dt) { partsUpdate(dt); },
  draw() {
    c.fillStyle = '#8FD3F4'; c.fillRect(0, 0, W, H);
    rr(100, 110, 1400, 740, 34, '#C8473A', 6); rr(122, 126, 670, 704, 20, '#FFF7E6', 4); rr(808, 126, 670, 704, 20, '#FFF7E6', 4); line(800, 126, 800, 830, '#9A3A30', 8);
    txt('Álbum de la granja', 800, 62, 50, INK, 'center', 700);
    const list = this.entries.slice(this.page * 12, this.page * 12 + 12);
    list.forEach((e, i) => this.card(e, ...this.cardPos(i)));
    const np = this.pages();
    if (this.page > 0) bigBtn({ x: 60, y: 480, r: 44 }, '#fff', () => pdS('M72 458 l-24 22 l24 22', INK, 9));
    if (this.page < np - 1) bigBtn({ x: 1540, y: 480, r: 44 }, '#fff', () => pdS('M1528 458 l24 22 l-24 22', INK, 9));
    for (let i = 0; i < np; i++) circ(800 - (np - 1) * 16 + i * 32, 872, 8, i === this.page ? '#C8473A' : '#fff', 2.5);
    bigBtn({ x: 1530, y: 64, r: 44 }, '#fff', () => { line(1514, 48, 1546, 80, INK, 7); line(1546, 48, 1514, 80, INK, 7); });
    partsDraw();

  card(e, x, y) {

    c.fillStyle = '#C9EEF9'; c.fillRect(x + 12, y + 12, 176, 196); c.fillStyle = mix(GRASS[seasonNow()], '#ffffff', .1); c.fillRect(x + 12, y + 150, 176, 60);
    let name = '', sub = '';
    if (e.kind === 'animal') {
      const a = e.a; c.save(); c.translate(x + 100, y + 186); const sc = animScale(a) * (a.sp === 'caballo' ? 1.15 : a.sp === 'vaca' ? 1.35 : 1.7); c.scale(sc, sc); drawSpecies(a, animOpts(a, { seed: 0 })); c.restore();
      name = a.name || '?'; sub = a.mom ? `Nació el día ${a.born}` : 'Desde el día 1';
    } else if (e.kind === 'dish') {
      const n = S.cooked[e.k] || 0; c.fillStyle = '#FFE8C2'; c.fillRect(x + 12, y + 12, 176, 196);

      name = cap(dishName(e.k)); sub = n ? `Hicimos ${n}` : 'Sin cocinar';

      if (e.kind === 'animal') { const a = e.a, st = stageOf(a); FARM.animalSound(a); say(`${a.name || 'Sin nombre'}, ${st === 0 ? BABY_NAME[a.sp] : SP_NAME[a.sp]}. ${a.mom ? `Nació el día ${a.born}.` : 'Vive en la granja desde el primer día.'}`); }
      else if (e.kind === 'dish') { const n = S.cooked[e.k] || 0; SFX.pop(); say(`${cap(ITEMS[e.k][0])}. ${n ? `Hicimos esta receta ${n === 1 ? 'una vez' : num(n, true) + ' veces'}.` : 'Todavía no hicimos esta receta.'}`); }
      else { SFX.pop(); say(e.who === 'ramon' ? `Ramón, el vecino. Le llevamos ${num(S.orders)} ${S.orders === 1 ? 'pedido' : 'pedidos'}.` : `El abuelo Paco. Vino de visita ${S.paco.n === 1 ? 'una vez' : num(S.paco.n, true) + ' veces'}.`); }
    });
  },
};

/* ===== Arranque ===== */
function demoFarm(cfg) { newFarm(Object.assign(defaultLook(), { name: '' }), cfg); S.started = false; }
function showStart() {
  const has = S && S.started;
  $('start').querySelector('h1').innerHTML = has ? 'La Granja<br>de <span id="stName"></span>' : 'La Granja';
  if (has) $('stName').textContent = S.farmer.name;
  $('stSub').textContent = has ? `Día ${S.day} · ${cap(SEASON_NAME[seasonNow()])}` : 'Siembra, riega y cuida a los animales.';
  $('start').hidden = false;
}
resize(); bindAdult();
(function () {
  const saved = loadSave();
  if (saved) { S = saved; S.animals.forEach(initRT); migrate(); }
  else demoFarm();
})();
go(TITLE); showStart(); requestAnimationFrame(frame);
$('bPlay').addEventListener('click', () => {
  audioInit(); applyVol(); $('start').hidden = true;
  if (S.started) go(FARM); else go(CREAR);
});
$('fs').addEventListener('click', fullscreen);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { save(); try { if (AC) AC.suspend(); window.speechSynthesis && speechSynthesis.cancel(); } catch (e) { } }
  else { try { if (AC) AC.resume(); } catch (e) { } lastT = performance.now() / 1000; }
});
addEventListener('pagehide', save);
if (WEB_BUILD) {
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
  (function () {
    const standalone = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone;
    if (standalone || !location.protocol.startsWith('http')) return;
    const box = $('inst'), b = $('bInst'), h = $('iosHelp'); let ev = null;
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    box.hidden = false;
    addEventListener('beforeinstallprompt', e => { e.preventDefault(); ev = e; });
    addEventListener('appinstalled', () => { box.hidden = true; });
    b.addEventListener('click', () => {
      if (ev) { ev.prompt(); ev.userChoice.then(() => { ev = null; }); return; }
      h.hidden = false;
      h.innerHTML = (ios ? 'En iPhone o iPad: abre esta página en <b>Safari</b>, toca <b>Compartir</b> y luego <b>Agregar a inicio</b>.' : 'Abre el menú del navegador (⋮) y elige <b>Instalar aplicación</b> o <b>Agregar a la pantalla de inicio</b>.') + ' Una vez instalado funciona <b>sin internet</b>.';
    });
  })();
}
window.__granja = { get S() { return S; }, F, L, FARM, go, CREAR, NOMBRE, TITLE, COCINA, ALBUM, nightSim, cam, NPC, RIDE, BUGS, get scene() { return scene; } };

</script>
